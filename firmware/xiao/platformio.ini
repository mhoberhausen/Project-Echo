[platformio]
default_envs = xiao_esp32s3_sense

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
extra_scripts = scripts/provision_wifi.py
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
    -D HUH_FIRMWARE_VERSION=\"0.1.0\"

[env:xiao_esp32s3_sense]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D ENABLE_SD_RECORDING_TEST=0

[env:xiao_esp32s3_sense_ota]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -D ENABLE_SD_RECORDING_TEST=0
upload_protocol = espota
upload_port = 192.0.2.1
upload_flags =
    --port=3232
    --auth=REDACTED_CREDENTIAL
monitor_port = socket://192.0.2.1:8766

[env:xiao_esp32s3_sense_sd_test]
extends = esp32_base
build_src_filter =
    +<*>
    -<device/SerialProvisioner.cpp>
    -<device/WifiCredentialStore.cpp>
    -<transport/TcpAudioTransport.cpp>
    -<transport/TrustedLanWifi.cpp>
build_flags =
    ${esp32_base.build_flags}
    -D ENABLE_SD_RECORDING_TEST=1

[env:native_protocol_tests]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<audio/AudioFrame.cpp>
    +<device/HardwareControlProtocol.cpp>
    +<protocol/HuhAudioProtocol.cpp>
    +<protocol/HuhMessageWriter.cpp>
