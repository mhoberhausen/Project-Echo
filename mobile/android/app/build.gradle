plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Firebase configuration is intentionally supplied by the app owner. Keeping this
// conditional lets local/offline builds remain usable before google-services.json exists.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'

    // Instrumentation uses an isolated applicationId specifically so tests cannot touch a
    // user's app data. It is intentionally not a Firebase app registration.
    tasks.matching { it.name == 'processInstrumentationGoogleServices' }.configureEach {
        enabled = false
    }
}

android {
    namespace = 'com.mobileobie.echo'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.mobileobie.echo'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '0.1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters += ['arm64-v8a']
        }

        externalNativeBuild {
            cmake {
                arguments += ['-DCMAKE_BUILD_TYPE=Release']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        instrumentation {
            initWith debug
            applicationIdSuffix '.testbed'
            matchingFallbacks = ['debug']
            debuggable true
        }
    }

    // Instrumentation must never install, clear, or uninstall the user's normal debug app.
    testBuildType 'instrumentation'

    buildFeatures {
        compose true
    }

    androidResources {
        noCompress += ['onnx']
    }

    // Gemma is delivered by Google Play as a separate install-time AI pack. It is ready
    // before first launch, while keeping the base install focused on transcription and
    // diarization.
    assetPacks = [':gemma_model']

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    ndkVersion = '28.2.13676358'

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.31.6'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    instrumentationImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    instrumentationImplementation 'androidx.compose.ui:ui-test-manifest'
}
